<text x="24" y="1539" font-size="12" fill="#15344b">Lines stop at inclusive equation endpoints.</text>
<text x="24" y="1558" font-size="12" fill="#15344b">Synthetic intervals are artificial software</text>
<text x="24" y="1577" font-size="12" fill="#15344b">demonstrations. Outputs are not</text>
<text x="24" y="1596" font-size="12" fill="#15344b">measurements or theoretical bounds; no</text>
<text x="24" y="1615" font-size="12" fill="#15344b">extrapolation is permitted.</text>
<text x="24" y="1653" font-size="12" fill="#15344b">Synthetic demonstrations have no empirical</text>
<text x="24" y="1672" font-size="12" fill="#15344b">fit error. Empirical fit error, when reported,</text>
<text x="24" y="1691" font-size="12" fill="#15344b">is not measurement uncertainty, a</text>
<text x="24" y="1710" font-size="12" fill="#15344b">confidence interval or a validated maximum</text>
<text x="24" y="1729" font-size="12" fill="#15344b">error bound. No statistical band is drawn.</text>
<text x="24" y="1767" font-size="12" fill="#15344b">Synthetic demonstrations have no physical</text>
<text x="24" y="1786" font-size="12" fill="#15344b">specimen; experimental conditions are not</text>
<text x="24" y="1805" font-size="12" fill="#15344b">applicable. Empirical models do not</text>
<text x="24" y="1824" font-size="12" fill="#15344b">establish unspecified specimen conditions.</text>
<text x="24" y="1862" font-size="12" fill="#15344b">Every applicable branch is retained at each</text>
<text x="24" y="1881" font-size="12" fill="#15344b">temperature. No selection, averaging,</text>
<text x="24" y="1900" font-size="12" fill="#15344b">smoothing or physical discontinuity is</text>
<text x="24" y="1919" font-size="12" fill="#15344b">inferred.</text>
<text x="24" y="1957" font-size="12" fill="#15344b">Listed overlap locations are branch</text>
<text x="24" y="1976" font-size="12" fill="#15344b">endpoints; any interval overlap remains</text>
<text x="24" y="1995" font-size="12" fill="#15344b">ambiguous throughout.</text>
<text x="24" y="2033" font-size="12" fill="#15344b">Synthetic intervals and inclusive endpoints</text>
<text x="24" y="2052" font-size="12" fill="#15344b">were chosen for demonstrations, not</text>
<text x="24" y="2071" font-size="12" fill="#15344b">measured validity. Empirical source data</text>
<text x="24" y="2090" font-size="12" fill="#15344b">ranges do not extend equation applicability.</text>
<text x="24" y="2128" font-size="12" fill="#15344b">Computed digits are arithmetic output, not</text>
<text x="24" y="2147" font-size="12" fill="#15344b">measurement precision.</text>
<text x="24" y="2185" font-size="12" fill="#15344b">Arithmetic and software checks are not</text>
<text x="24" y="2204" font-size="12" fill="#15344b">empirical validation or independent</text>
<text x="24" y="2223" font-size="12" fill="#15344b">scientific review. Translations are not</text>
<text x="24" y="2242" font-size="12" fill="#15344b">independently reviewed.</text>
<text x="24" y="2280" font-size="12" fill="#15344b">Bundled demonstrations are original</text>
<text x="24" y="2299" font-size="12" fill="#15344b">project-authored synthetic examples. Each</text>
<text x="24" y="2318" font-size="12" fill="#15344b">model retains its own provenance and</text>
<text x="24" y="2337" font-size="12" fill="#15344b">reuse status. See project LICENSE and</text>
<text x="24" y="2356" font-size="12" fill="#15344b">source metadata.</text>
</svg>
