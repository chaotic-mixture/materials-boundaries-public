<title>Temperature model outputs</title><desc>Lines stop at inclusive equation endpoints. Synthetic intervals are artificial software demonstrations. Outputs are not measurements or theoretical bounds; no extrapolation is permitted. Synthetic demonstrations have no empirical fit error. Empirical fit error, when reported, is not measurement uncertainty, a confidence interval or a validated maximum error bound. No statistical band is drawn. Every applicable branch is retained at each temperature. No selection, averaging, smoothing or physical discontinuity is inferred.</desc>
