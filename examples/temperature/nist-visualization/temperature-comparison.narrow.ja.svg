</g>
<text x="24" y="1415" font-size="12" fill="#15344b">曲線は端点を含む式の区間で終了する。合成区間は</text>
<text x="24" y="1434" font-size="12" fill="#15344b">人為的なソフトウェアデモである。出力は測定や理</text>
<text x="24" y="1453" font-size="12" fill="#15344b">論的限界ではなく、外挿は許可されない。</text>
<text x="24" y="1491" font-size="12" fill="#15344b">合成デモには経験的適合誤差がない。経験的モデル</text>
<text x="24" y="1510" font-size="12" fill="#15344b">の適合誤差は測定不確かさ、信頼区間、検証済み最</text>
<text x="24" y="1529" font-size="12" fill="#15344b">大誤差限界ではない。統計的な帯は描かない。</text>
<text x="24" y="1567" font-size="12" fill="#15344b">合成デモに物理的試料はなく、実験条件は適用され</text>
<text x="24" y="1586" font-size="12" fill="#15344b">ない。経験的モデルも未指定の試料条件を確立しな</text>
<text x="24" y="1605" font-size="12" fill="#15344b">い。</text>
<text x="24" y="1643" font-size="12" fill="#15344b">各温度で適用可能なすべての分岐を保持する。選択</text>
<text x="24" y="1662" font-size="12" fill="#15344b">、平均化、平滑化、物理的不連続の推定は行わない</text>
<text x="24" y="1681" font-size="12" fill="#15344b">。</text>
<text x="24" y="1719" font-size="12" fill="#15344b">列挙した重複位置は分岐端点である。区間の重複は</text>
<text x="24" y="1738" font-size="12" fill="#15344b">その全域で複数予測を保持する。</text>
<text x="24" y="1776" font-size="12" fill="#15344b">合成区間と端点包含規則はデモ用に選択され、測定</text>
<text x="24" y="1795" font-size="12" fill="#15344b">された有効性を示さない。経験的な出典データ区間</text>
<text x="24" y="1814" font-size="12" fill="#15344b">は式の適用範囲を拡張しない。</text>
<text x="24" y="1852" font-size="12" fill="#15344b">表示桁数は計算出力であり、測定精度ではない。</text>
<text x="24" y="1890" font-size="12" fill="#15344b">算術・ソフトウェア検査は経験的検証や独立した科</text>
<text x="24" y="1909" font-size="12" fill="#15344b">学的査読ではない。翻訳は独立した査読を受けてい</text>
<text x="24" y="1928" font-size="12" fill="#15344b">ない。</text>
<text x="24" y="1966" font-size="12" fill="#15344b">同梱デモはプロジェクト独自の合成例である。各モ</text>
