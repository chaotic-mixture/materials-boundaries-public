<svg xmlns="http://www.w3.org/2000/svg" width="380" height="2130" viewBox="0 0 380 2130" role="img">
<title>温度モデルの出力</title><desc>曲線は端点を含む式の区間で終了する。合成区間は人為的なソフトウェアデモである。出力は測定や理論的限界ではなく、外挿は許可されない。 合成デモには経験的適合誤差がない。経験的モデルの適合誤差は測定不確かさ、信頼区間、検証済み最大誤差限界ではない。統計的な帯は描かない。 各温度で適用可能なすべての分岐を保持する。選択、平均化、平滑化、物理的不連続の推定は行わない。</desc>
<rect width="100%" height="100%" fill="#f6f9fc"/>
<style>text{font-family:DejaVu Sans,Noto Sans CJK JP,sans-serif} .grid{stroke:#d6e0e8;stroke-width:1}</style>
<text x="24" y="25" font-size="11" fill="#15344b">MATERIALS BOUNDARIES · v0.16.0</text>
<text x="24" y="54" font-size="21" fill="#15344b">温度モデルの出力</text>
<text x="24" y="82" font-size="12" fill="#15344b">合成デモと出典付きモデル · 個別パネル</text>
<text x="24" y="102" font-size="12" fill="#15344b">温度軸は共通。各パネルの弾性率目盛は独立して明</text>
<text x="24" y="121" font-size="12" fill="#15344b">示。重ね描きや試験片条件の同一性は主張しない。</text>
