<text x="38" y="1225" font-size="11" fill="#a45117">分枝 2: synthetic_overlap_50_100</text>
<text x="38" y="1242" font-size="11" fill="#a45117">評価区間: 50–100 K · 出典データ区間:</text>
<text x="38" y="1259" font-size="11" fill="#a45117">適用なし：測定なし</text>
