<text x="38" y="1361" font-size="11" fill="#15344b">synthetic_overlap_50_100：32.500000 GPa</text>
<text x="38" y="1395" font-size="11" fill="#15344b">プロジェクト独自の合成デモ。再利用条件はプロジェ</text>
