<title>Ausgaben von Temperaturmodellen</title><desc>Linien enden an inklusiven Gleichungsgrenzen. Synthetische Intervalle sind künstliche Softwaredemonstrationen. Ausgaben sind keine Messungen oder theoretischen Schranken; keine Extrapolation. Synthetische Demonstrationen haben keinen empirischen Anpassungsfehler. Berichtete empirische Anpassungsfehler sind keine Messunsicherheit, kein Konfidenzintervall und keine validierte maximale Fehlerschranke. Kein statistisches Band. Bei jeder Temperatur bleiben alle anwendbaren Zweige erhalten. Keine Auswahl, Mittelung, Glättung oder abgeleitete physikalische Unstetigkeit.</desc>
