<text x="24" y="895" font-size="12" fill="#15344b">Linien enden an inklusiven Gleichungsgrenzen. Synthetische Intervalle sind künstliche Softwaredemonstrationen. Ausgaben sind keine</text>
<text x="24" y="914" font-size="12" fill="#15344b">Messungen oder theoretischen Schranken; keine Extrapolation.</text>
<text x="24" y="952" font-size="12" fill="#15344b">Synthetische Demonstrationen haben keinen empirischen Anpassungsfehler. Berichtete empirische Anpassungsfehler sind keine</text>
<text x="24" y="971" font-size="12" fill="#15344b">Messunsicherheit, kein Konfidenzintervall und keine validierte maximale Fehlerschranke. Kein statistisches Band.</text>
<text x="24" y="1009" font-size="12" fill="#15344b">Synthetische Demonstrationen haben keine physikalische Probe; Versuchsbedingungen sind nicht anwendbar. Empirische Modelle belegen</text>
<text x="24" y="1028" font-size="12" fill="#15344b">keine unbestimmten Probenbedingungen.</text>
<text x="24" y="1066" font-size="12" fill="#15344b">Bei jeder Temperatur bleiben alle anwendbaren Zweige erhalten. Keine Auswahl, Mittelung, Glättung oder abgeleitete physikalische</text>
<text x="24" y="1085" font-size="12" fill="#15344b">Unstetigkeit.</text>
<text x="24" y="1123" font-size="12" fill="#15344b">Aufgeführte Überlappungsstellen sind Zweigendpunkte; ein überlappendes Intervall bleibt durchgehend mehrdeutig.</text>
<text x="24" y="1161" font-size="12" fill="#15344b">Synthetische Intervalle und inklusive Endpunkte dienen der Demonstration und belegen keine gemessene Gültigkeit. Empirische</text>
<text x="24" y="1180" font-size="12" fill="#15344b">Quelldatenbereiche erweitern nicht den Gleichungsgültigkeitsbereich.</text>
<text x="24" y="1218" font-size="12" fill="#15344b">Berechnete Stellen sind Rechenergebnisse, keine Messgenauigkeit.</text>
<text x="24" y="1256" font-size="12" fill="#15344b">Arithmetik- und Softwareprüfungen sind keine empirische Validierung oder unabhängige wissenschaftliche Begutachtung. Übersetzungen</text>
<text x="24" y="1275" font-size="12" fill="#15344b">wurden nicht unabhängig geprüft.</text>
<text x="24" y="1313" font-size="12" fill="#15344b">Enthaltene Demonstrationen sind originale, projekteigene synthetische Beispiele. Jedes Modell behält eigene Herkunfts- und</text>
<text x="24" y="1332" font-size="12" fill="#15344b">Wiederverwendungsangaben. Siehe Projekt-LICENSE und Quellenmetadaten.</text>
