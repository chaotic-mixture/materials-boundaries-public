<text x="24" y="770" font-size="12" fill="#15344b">曲线止于包含端点的公式区间。合成区间为人为设定的软件演示。输出不是测量或理论界，不允许外推。</text>
<text x="24" y="808" font-size="12" fill="#15344b">合成演示没有经验拟合误差。经验模型报告的拟合误差不是测量不确定性、置信区间或经验证的最大误差界。不绘制统计带。</text>
<text x="24" y="846" font-size="12" fill="#15344b">合成演示没有物理试样，实验条件不适用。经验模型不会确立未指定的试样条件。</text>
<text x="24" y="884" font-size="12" fill="#15344b">每个温度保留所有适用分支。不选择、平均、平滑，也不推断物理不连续。</text>
<text x="24" y="922" font-size="12" fill="#15344b">所列重叠位置为分支端点；若存在区间重叠，整个重叠区间均保留多值。</text>
<text x="24" y="960" font-size="12" fill="#15344b">合成区间及包含端点的规则为演示而设，不代表测得的有效性。经验来源的数据区间不扩展公式适用范围。</text>
<text x="24" y="998" font-size="12" fill="#15344b">计算位数不代表测量精度。</text>
<text x="24" y="1036" font-size="12" fill="#15344b">算术和软件检查不属于经验验证或独立科学评审。译文未经独立评审。</text>
<text x="24" y="1074" font-size="12" fill="#15344b">内置演示为项目原创的合成示例。每个模型保留自身的来源与复用状态。参见项目 LICENSE 和来源元数据。</text>
