<title>温度模型输出</title><desc>曲线止于包含端点的公式区间。合成区间为人为设定的软件演示。输出不是测量或理论界，不允许外推。 合成演示没有经验拟合误差。经验模型报告的拟合误差不是测量不确定性、置信区间或经验证的最大误差界。不绘制统计带。 每个温度保留所有适用分支。不选择、平均、平滑，也不推断物理不连续。</desc>
<rect width="100%" height="100%" fill="#f6f9fc"/>
