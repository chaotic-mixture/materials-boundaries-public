[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
license = {file = "LICENSE"}
name = "materials-lifecycle-prototype"
version = "0.1.0"
description = "Local bounded acquisition and review-bound dataset snapshots"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
materials-lifecycle = "materials_lifecycle.__main__:main"
[tool.setuptools.packages.find]
include = ["materials_lifecycle*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
