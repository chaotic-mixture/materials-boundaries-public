[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-boundaries"
dynamic = ["version"]
description = "Condition-aware material bounds, mechanics models and elastic stability criteria"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}
authors = [{name = "chaotic-mixture"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/chaotic-mixture/materials-boundaries-public"
Issues = "https://github.com/chaotic-mixture/materials-boundaries-public/issues"
Documentation = "https://github.com/chaotic-mixture/materials-boundaries-public/tree/main/docs"

[project.optional-dependencies]
dev = ["jsonschema[format-nongpl]>=4.18,<5"]

[project.scripts]
materials-boundaries = "materials_boundaries.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["materials_boundaries*"]

[tool.setuptools.dynamic]
version = {attr = "materials_boundaries._version.__version__"}

[tool.setuptools.package-data]
materials_boundaries = ["data/*.json"]
