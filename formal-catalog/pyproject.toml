[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-project-catalog"
version = "0.1.0"
description = "Versioned formal project admissions with separate legacy and computed provenance"
requires-python = ">=3.10"
dependencies = ["materials-boundaries==0.35.0"]
license = {file = "LICENSE"}

[project.scripts]
materials-project-catalog = "materials_project_catalog.__main__:main"

[tool.setuptools.packages.find]
include = ["materials_project_catalog*"]

[tool.setuptools.package-data]
materials_project_catalog = ["data/*.json"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
