name: database-checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Database behavior and incremental contracts
        run: python -m unittest discover -s tests -p 'test_database*.py' -v
      - name: Current material graph contracts (once, no history replay)
        run: python -m materials_boundaries.database check --scientific-contracts
      - name: Export a source-qualified example
        run: python -m materials_boundaries.database export --query C11000 --quantity mass_density --output database-example
      - name: Verify the exported snapshot
        run: python -m materials_boundaries.database verify --snapshot database-example
      - uses: actions/upload-artifact@v4
        with:
          name: database-example-${{ matrix.python-version }}-${{ github.sha }}
          path: database-example/
          if-no-files-found: error
