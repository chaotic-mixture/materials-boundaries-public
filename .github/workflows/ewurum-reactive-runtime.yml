name: ewurum-reactive-runtime
on:
  push:
    branches: [experimental/ewurum2025-reactive-runtime]
permissions:
  contents: read
jobs:
  candidate-and-installed:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_ewurum_reactive_runtime_ci.py --validate-scope
      - run: "python -m pip install --no-deps --only-binary=:all: -r experimental/platform/ci/build-requirements.txt"
      - run: python -m pip install --no-build-isolation -e '.[dev]'
      - run: python scripts/run_ewurum_reactive_runtime_ci.py --validate-inventory
      - run: python scripts/run_ewurum_reactive_runtime_ci.py --source-tests
      - run: python scripts/validate_catalogs.py
      - run: python -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir dist . ./formal-catalog ./experimental/platform/federation ./experimental/platform/query-service ./experimental/platform/lifecycle ./experimental/platform
      - run: "python -m pip download --no-deps --only-binary=:all: --dest dist/dependencies -r experimental/platform/requirements-lock.txt -r experimental/platform/ci/projection-requirements.txt"
      - run: python scripts/run_ewurum_reactive_runtime_ci.py --wheel-dir dist --dependency-dir dist/dependencies
